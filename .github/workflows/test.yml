name: test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        ruby-version: ['2.3', '2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0', 'head']
        include:
          - ruby-version: 'head'
            allow_failures: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run test
        run: bundle exec rake
        continue-on-error: ${{ matrix.allow_failures == 'true' }}

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Run type check
        run: bundle exec steep check --with-expectations

  test-success:
    name: All tests passed
    needs: [test, type-check]
    # Run even when a dependency fails or is skipped, so this required check
    # cannot report success without both tests and type checks passing.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify test and type check results
        run: test "$TEST_RESULT" = success && test "$TYPE_CHECK_RESULT" = success
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TYPE_CHECK_RESULT: ${{ needs.type-check.result }}
